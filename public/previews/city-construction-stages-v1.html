<!doctype html>

<title>Cidade em construção — três etapas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1e2925;color:#f2e4c8;font-family:system-ui,sans-serif;padding:24px}main{max-width:1300px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#c0c4b5;line-height:1.5}.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}figure{margin:0;padding:16px;background:#29372f;border:1px solid #53634d;border-radius:20px}svg{display:block;width:100%;height:auto;aspect-ratio:1}figcaption{font-weight:700}small{display:block;margin-top:6px;color:#c0c4b5;line-height:1.5}@media(max-width:650px){body{padding:16px}.stages{grid-template-columns:1fr}}

<main>
<h1>Uma cidade crescendo</h1>
<p>Três etapas de construção e a cidade pronta, com o mesmo enquadramento do terreno.</p>
<div class="stages">
<figure><svg viewBox="-62.7 53.3 1379.4 1240.4" role="img" aria-label="Terreno com ruas, estacas e fundações baixas"><image href="../cities/city-construction-stage-1-v1.png" width="1254" height="1254"/></svg><figcaption>1 · Demarcação</figcaption><small>Ruas abertas, estacas, cordas e primeiras fundações.</small></figure>
<figure><svg viewBox="-62.7 53.3 1379.4 1240.4" role="img" aria-label="Cidade com armações de madeira e paredes incompletas"><image href="../cities/city-construction-stage-2-v1.png" width="1254" height="1254"/></svg><figcaption>2 · Estruturas</figcaption><small>Paredes subindo e armações de madeira à vista.</small></figure>
<figure><svg viewBox="-62.7 53.3 1379.4 1240.4" role="img" aria-label="Cidade com alguns telhados e vários trechos ainda em obras"><image href="../cities/city-construction-stage-3-v1.png" width="1254" height="1254"/></svg><figcaption>3 · Acabamento</figcaption><small>Parte dos telhados pronta, com muralhas e construções ainda abertas.</small></figure>
<figure><svg viewBox="-62.7 53.3 1379.4 1240.4" role="img" aria-label="Cidade pronta com casas, muralhas e jardins"><image href="../cities/city-completed-v1.png" width="1254" height="1254"/></svg><figcaption>4 · Cidade consolidada</figcaption><small>Casas habitadas, ruas e muralhas prontas.</small></figure>
</div>
</main>
